<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome | Cake Staff Welfare</title>

  <link rel="stylesheet" href="welcome.css">
</head>

<body>

  <!-- Background decoration -->
  <div class="background-shape shape-one"></div>
  <div class="background-shape shape-two"></div>

  <main class="landing-container" id="landingContainer">

    <section class="welcome-card">

      <!-- Logo -->
      <div class="logo-wrapper">
        <img
          src="Twi-logo.png"
          alt="Cake Staff Welfare Logo"
          class="welcome-logo"
        >
      </div>

      <!-- Small label -->
      <span class="welcome-label">WELCOME TO</span>

      <!-- Main heading -->
      <h1>
        CAKE STAFFS
        <span>WELFARE</span>
      </h1>

      <h2>CONTRIBUTION REVIEW</h2>

      <div class="heading-line"></div>

      <!-- Description -->
      <p class="welcome-description">
        Track contributions, review member records,
        and access welfare reports with ease.
      </p>

      <!-- Button -->
      <button class="btn-enter" id="enterBtn">
        <span>View Reports</span>
        <span class="arrow">→</span>
      </button>

      <!-- Footer -->
      <footer>
        <span>CAKE STAFF WELFARE</span>
        <span class="footer-dot">•</span>
        <span>Version 3.0</span>
      </footer>

    </section>

  </main>

  <script src="welcome.js"></script>

</body>
</html>
